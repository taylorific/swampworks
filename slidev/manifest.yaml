manifestVersion: 1
name: "@taylor/slidev"
version: "2026.10.11.2"
description: "Work on Slidev decks entirely inside a container (boxcutter/slidev by default) with Docker or Apple's container CLI, so the host needs no Node. A slide fit check opens every slide with all clicks revealed and flags content that runs off the bottom or right edge, bumps against the bottom, or is hidden inside a box that scrolls or clips (a code block with maxHeight, a wide table), with each slide's source file and line and a screenshot. Also serves the deck in the background, exports it to PDF, creates new decks, and lists and upgrades Slidev, vue and playwright-chromium while leaving pinned versions alone. Bundles a slide-fit skill for agent-driven fit passes."
repository: "https://github.com/taylorific/swampworks"
models:
  - slidev_deck.ts
additionalFiles:
  - README.md
  - LICENSE
  - COPYING
  - COPYING-EXCEPTION
skills:
  - slide-fit
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
labels:
  - slidev
  - slides
  - presentations
  - docker
  - apple-container
