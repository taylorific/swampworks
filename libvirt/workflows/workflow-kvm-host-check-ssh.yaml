id: 2a111367-cb4b-49bf-9307-34133683444c
name: "@taylor/kvm-host-check-ssh"
description: Check a KVM host against the kvm-training setup over SSH, with nothing installed on the host; changes nothing
tags: {}
inputs:
  required: [host]
  properties:
    host:
      type: string
      description: The KVM host as an ssh destination, e.g. admin@kvm1.example.com or a name from ~/.ssh/config
    mode:
      type: string
      enum: [nat, bridge, macvtap, routed]
      default: bridge
      description: How guests connect; the uplink step fails if it can't work on the host
    bridge:
      type: string
      default: br0
      description: The host's Linux bridge, for bridge mode
    network:
      type: string
      default: host-network
      description: Name of the libvirt network to check
jobs:
  - name: kvm-host
    description: Runs where swamp runs, reaching the KVM host over SSH
    steps:
      - name: uplink
        description: Can guests connect this way on this host?
        task:
          type: model_method
          modelType: "@taylor/libvirt/uplink"
          modelName: ssh-kvm-uplink
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.host }}
            mode: ${{ inputs.mode }}
        dependsOn: []
      - name: host
        description: QEMU, libvirt and virtinst, and the user in libvirt and kvm
        task:
          type: model_method
          modelType: "@taylor/libvirt/host"
          modelName: ssh-kvm-host
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.host }}
        dependsOn:
          - step: uplink
            condition:
              type: succeeded
      - name: pool-default
        description: Disk images in /var/lib/libvirt/images
        task:
          type: model_method
          modelType: "@taylor/libvirt/pool"
          modelName: ssh-kvm-pool-default
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.host }}
            name: default
        dependsOn:
          - step: host
            condition:
              type: succeeded
      - name: pool-iso
        description: ISOs in /var/lib/libvirt/iso
        task:
          type: model_method
          modelType: "@taylor/libvirt/pool"
          modelName: ssh-kvm-pool-iso
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.host }}
            name: iso
        dependsOn:
          - step: host
            condition:
              type: succeeded
      - name: network
        description: The libvirt network guests attach to
        task:
          type: model_method
          modelType: "@taylor/libvirt/network"
          modelName: ssh-kvm-network
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.host }}
            name: ${{ inputs.network }}
            mode: ${{ inputs.mode }}
            bridge: ${{ inputs.bridge }}
        dependsOn:
          - step: host
            condition:
              type: succeeded
version: 1
