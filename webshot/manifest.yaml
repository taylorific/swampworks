manifestVersion: 1
name: "@taylor/webshot"
version: "2026.10.14.1"
license: AGPL-3.0-only
description: "Full-page screenshots of web pages (PNG, JPEG, WebP). Runs headless Chrome in a fresh, version-pinned Docker container with Noto fonts (or a local Chrome), scrolls to the bottom so lazy content renders, hides cookie banners and fixed overlays, stitches pages taller than Chrome's capture limit, records the HTTP status, and stores the image plus capture metadata as swamp data."
repository: "https://github.com/taylorific/swampworks"
models:
  - webshot.ts
additionalFiles:
  - README.md
  - LICENSE
  - COPYING
  - COPYING-EXCEPTION
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
labels:
  - screenshot
  - browser
  - chrome
  - web
  - docker
