manifestVersion: 1
name: "@taylor/swamp-diagrams"
version: "2026.11.07.1"
license: AGPL-3.0-or-later
description: "Diagrams of swamp workflows and of behaviors' state machines, drawn as a light and dark SVG pair (or as Mermaid). workflow draws workflows as flowcharts: a box per job, a node per step, and dependsOn arrows labelled with their condition. stateMachine draws a behavior's phases and the methods that move between them, from the transition lines in a published extension's description (such as @swamp/issue-lifecycle), a file or passed in, with the main path down the middle, failure and detour phases beside it, loops, retries and human-only gates marked, and notes alongside. Diagrams are written next to Markdown docs and embedded in marked blocks with a <picture> that follows GitHub's light and dark modes; with format=mermaid they can be rendered to SVG or PNG with the mermaid-cli container."
repository: "https://github.com/taylorific/swampworks"
models:
  - swamp_diagram.ts
additionalFiles:
  - README.md
  - LICENSE
  - COPYING
  - COPYING-EXCEPTION
labels:
  - svg
  - mermaid
  - diagrams
  - documentation
  - workflows
  - state-machine
