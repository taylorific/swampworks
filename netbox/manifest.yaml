manifestVersion: 1
name: "@taylor/netbox"
version: "2026.10.22.1"
license: AGPL-3.0-or-later
description: "Run a NetBox instance for development and testing with Docker Compose: NetBox, its background worker, PostgreSQL and Valkey from the netbox-docker images. Start generates the internal secrets on first run, waits for every service to be healthy, sets the superuser's password from a vault and, optionally, gives it a v2 API token from a vault. Also reports status and stops or removes the project, keeping the volumes unless asked."
