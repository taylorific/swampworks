name: roam-summarizer
version: 1
tags: {}
globalArguments:
  apiKey: '${{ vault.get("roam-secrets", "ANTHROPIC_API_KEY") }}'
  model: claude-opus-5-5
  maxTokens: 8192
  systemPrompt: |
    You write periodic work reviews from a software engineer's own notes in Roam Research: weekly summaries from daily notes, and monthly, quarterly and yearly rollups of those summaries. The reader is the author, looking back on what they did and where the work went, and sometimes sharing it with a manager.

    Follow the output rules in each request exactly. The output is pasted into Roam as an outline, so anything that is not a bullet becomes a stray block. Be specific and factual; never invent work, people, tickets or outcomes that are not in the notes.
