manifestVersion: 1
name: "@taylor/roam-graph"
version: "2026.10.22.1"
license: AGPL-3.0-or-later
description: "Periodic reviews for a Roam Research graph: weekly summaries of the Activities block on your daily notes, monthly rollups of the weeklies, quarterly rollups of the monthlies, and a yearly rollup of the quarterlies. Reads and writes the graph through Roam's backend API, writes each summary with Claude, and publishes it back to the graph as a heading block on the daily note of the Monday after the period ends. Rollups find their sources by searching the graph, so summaries you write or edit by hand are rolled up too."
repository: "https://github.com/taylorific/swampworks"
models:
  - roam_graph.ts
workflows:
  - workflow-roam-review.yaml
skills:
  - roam-review
additionalFiles:
  - README.md
  - LICENSE
  - COPYING
  - COPYING-EXCEPTION
dependencies:
  - "@keeb/anthropic"
labels:
  - roam
  - roam-research
  - notes
  - knowledge-management
  - journal
  - summaries
